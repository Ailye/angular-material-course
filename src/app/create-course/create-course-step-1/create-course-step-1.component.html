<div [formGroup]="form" class="course-details-form">
  <mat-form-field>
    <input matInput placeholder="Course title" formControlName="title" #title />

    <mat-hint align="end"> {{ title.value?.length }} / 60 </mat-hint>
    @if (courseTitle.errors?.minlength) {
    <mat-error> A minimum length of 5 characters is required </mat-error>
    }
  </mat-form-field>

  <mat-radio-group class="course-type" formControlName="courseType">
    <mat-radio-button value="free">Free</mat-radio-button>
    <mat-radio-button value="premium">Premium</mat-radio-button>
  </mat-radio-group>

  <mat-form-field appearance="outline">
    <mat-select formControlName="category" placeholder="Select category">
      <mat-optgroup label="Beginners">
        <mat-option value="newprogramming">New to Programming</mat-option>
        <mat-option value="newjavascript">New to Javascript</mat-option>
        <mat-option value="newangular">New to Angular</mat-option>
      </mat-optgroup>

      <mat-option value="INTERMEDIATE">Intermediate</mat-option>
      <mat-option value="ADVANCED">Advanced</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <input
      matInput
      formControlName="releasedAt"
      placeholder="Release date"
      [matDatepicker]="releasedAtPicker"
    />

    <mat-datepicker-toggle
      matSuffix
      [for]="releasedAtPicker"
    ></mat-datepicker-toggle>

    <mat-datepicker [dateClass]="dateClass" #releasedAtPicker></mat-datepicker>
  </mat-form-field>

  <mat-checkbox
    color="primary"
    formControlName="downloadsAllowed"
    [indeterminate]="true"
  >
    Downloads allowed ?
  </mat-checkbox>

  <mat-form-field appearance="outline">
    <textarea
      matInput
      formControlName="longDescription"
      placeholder="Description"
      cdkTextareaAutosize
      cdkAutosizeMinRows="1"
      cdkAutosizeMaxRows="25"
    ></textarea>
  </mat-form-field>
</div>
